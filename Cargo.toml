[package]
name = "raylauncher"
version = "0.1.3"
edition = "2024"
description = "Keyboard launcher for macOS: apps, commands, system actions, and a calculator"
license = "MIT"
repository = "https://github.com/undo-git-pull/raylauncher"
readme = "README.md"

[dependencies]
block2 = "0.6"
nucleo-matcher = "0.3.1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
